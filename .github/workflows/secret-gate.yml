name: Prevent committed credential exposures
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  current-tree-secret-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - run: python3 scripts/check_secrets.py
